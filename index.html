<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PICO CIRCUITPYTHON BLOCK BUILDER — ブロックを並べて code.py を作る</title>
<meta name="description" content="Raspberry Pi Pico の CircuitPython 用 code.py を、ブロックを並べるだけで作れるツール。インストール不要、ブラウザだけで動きます。">
<style>
/* ============================================================
   PICO CIRCUITPYTHON BLOCK BUILDER — 黒レジスト + 金メッキパッドのシルク印刷を主題にした配色
   ============================================================ */
:root{
  --mask:#0a0e0f;          /* ソルダーレジスト(黒) */
  --mask-2:#101617;
  --panel:#141c1d;
  --raise:#1b2526;
  --edge:#263335;
  --edge-hi:#334547;
  --silk:#e9f0ec;          /* シルクスクリーン白 */
  --silk-dim:#93a5a3;
  --silk-mute:#5f7273;
  --gold:#d9a441;          /* 金フラッシュ */
  --gold-soft:#8a6a2c;
  --trace:#3fbfa0;         /* 配線パターン */
  --signal:#63a8e8;
  --alert:#e5544b;
  --violet:#a98cf0;
  --pink:#ef7fae;
  --orange:#f08a4b;

  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular","Menlo","DejaVu Sans Mono","Consolas",monospace;

  --r:3px;
  --hdr:52px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--mask);
  color:var(--silk);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.55;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
/* 基板の網目テクスチャ */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(255,255,255,.014) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.014) 1px,transparent 1px);
  background-size:22px 22px;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
input,select,textarea{
  background:var(--mask-2);border:1px solid var(--edge);color:var(--silk);
  border-radius:var(--r);padding:3px 6px;outline:none;
}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--gold);outline-offset:1px;
}
input[type=number]{font-family:var(--mono)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2b3a3c;border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:#3b5052}

/* ---------- ヘッダ ---------- */
.topbar{
  height:var(--hdr);position:relative;z-index:5;
  display:flex;align-items:center;gap:14px;padding:0 12px;
  background:linear-gradient(180deg,#182121,#0e1415);
  border-bottom:1px solid var(--edge);
}
.brand{display:flex;align-items:center;gap:9px;flex:none}
.chipmark{
  width:26px;height:26px;border-radius:4px;flex:none;
  background:linear-gradient(145deg,#2a3638,#141b1c);
  border:1px solid var(--edge-hi);position:relative;
}
.chipmark::before,.chipmark::after{
  content:"";position:absolute;left:-4px;right:-4px;height:3px;
  background:
    repeating-linear-gradient(90deg,var(--gold) 0 3px,transparent 3px 7px);
  opacity:.8;
}
.chipmark::before{top:5px}
.chipmark::after{bottom:5px}
.brand h1{
  font-size:15px;font-weight:800;letter-spacing:.22em;
  font-family:var(--mono);color:var(--silk);
}
.brand .sub{font-size:9.5px;letter-spacing:.18em;color:var(--gold);font-family:var(--mono)}
.topbar .spacer{flex:1}
.projname{
  background:var(--mask);border:1px solid var(--edge);border-radius:var(--r);
  padding:5px 9px;min-width:150px;max-width:260px;font-size:13px;
}
.tbtn{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 11px;border:1px solid var(--edge-hi);border-radius:var(--r);
  background:linear-gradient(180deg,#1e2829,#161e1f);
  font-size:12px;letter-spacing:.04em;color:var(--silk);white-space:nowrap;
}
.tbtn:hover{border-color:var(--gold-soft);color:#fff}
.tbtn.primary{
  border-color:var(--gold-soft);color:#1a1206;
  background:linear-gradient(180deg,#e9bc5c,#c88f2c);font-weight:700;
}
.tbtn.primary:hover{background:linear-gradient(180deg,#f3c76c,#d69c33)}

/* ---------- レイアウト ---------- */
.stage{
  position:relative;z-index:1;
  height:calc(100% - var(--hdr));
  display:grid;grid-template-columns:246px minmax(0,1fr) 400px;
}
.col{display:flex;flex-direction:column;min-height:0;min-width:0}
.col.left{border-right:1px solid var(--edge);background:var(--mask-2)}
.col.mid{background:var(--mask)}
.col.right{border-left:1px solid var(--edge);background:var(--mask-2)}

.colhead{
  flex:none;display:flex;align-items:center;gap:8px;
  padding:0 10px;height:34px;border-bottom:1px solid var(--edge);
  background:var(--panel);
}
.colhead h2{
  font-size:10px;font-weight:700;letter-spacing:.2em;font-family:var(--mono);
  color:var(--silk-dim);text-transform:uppercase;
}
.colhead .jp{font-size:11px;color:var(--silk-mute);letter-spacing:.06em}
.colbody{flex:1;overflow-y:auto;overflow-x:hidden}

/* ---------- パレット ---------- */
.pal-tabs{display:flex;flex:none;border-bottom:1px solid var(--edge);background:var(--mask)}
.pal-tabs button{
  flex:1;padding:8px 4px;font-size:11.5px;letter-spacing:.08em;color:var(--silk-mute);
  border-bottom:2px solid transparent;
}
.pal-tabs button.on{color:var(--gold);border-bottom-color:var(--gold);background:var(--panel)}
.palsearch{padding:8px;border-bottom:1px solid var(--edge)}
.palsearch input{width:100%;padding:5px 8px;font-size:12px}
.palgroup{padding:9px 8px 3px}
.palgroup h3{
  font-size:9.5px;letter-spacing:.19em;font-family:var(--mono);color:var(--silk-mute);
  padding:0 2px 5px;border-bottom:1px dashed var(--edge);margin-bottom:6px;
}
.palitem{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:6px 7px;margin-bottom:3px;border-radius:var(--r);
  border:1px solid transparent;background:var(--panel);cursor:grab;
  border-left:3px solid var(--c,var(--gold));
}
.palitem:hover{background:var(--raise);border-color:var(--edge-hi);border-left-color:var(--c,var(--gold))}
.palitem .ic{width:17px;text-align:center;font-size:14px;flex:none;filter:saturate(.85)}
.palitem .tx{flex:1;min-width:0}
.palitem .tx b{display:block;font-size:12.5px;font-weight:600;line-height:1.3}
.palitem .tx small{display:block;font-size:10px;color:var(--silk-mute);line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 中央: 部品リスト & プログラム ---------- */
.midscroll{padding:10px 12px 90px}
.sect{margin-bottom:16px}
.secthead{
  display:flex;align-items:center;gap:8px;margin-bottom:7px;
}
.secthead .bar{
  flex:none;width:4px;height:15px;border-radius:2px;background:var(--gold);
}
.secthead h3{font-size:12px;letter-spacing:.12em;font-weight:700}
.secthead .note{font-size:10.5px;color:var(--silk-mute);letter-spacing:.04em}
.secthead .spacer{flex:1}

.emptyslot{
  border:1px dashed var(--edge-hi);border-radius:var(--r);
  padding:13px 10px;text-align:center;color:var(--silk-mute);font-size:11.5px;
  background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(255,255,255,.012) 6px 12px);
}

/* 部品カード */
.partcard{
  border:1px solid var(--edge);border-radius:var(--r);background:var(--panel);
  margin-bottom:6px;border-left:3px solid var(--c,var(--gold));
}
.partcard .ph{display:flex;align-items:center;gap:8px;padding:6px 8px}
.partcard .ph .ic{font-size:15px}
.partcard .ph .nm{
  font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--c,var(--gold));
  background:var(--mask);border:1px solid var(--edge);border-radius:var(--r);
  padding:2px 5px;width:110px;
}
.partcard .ph .ty{font-size:11.5px;color:var(--silk-dim);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.partcard .pb{
  display:flex;flex-wrap:wrap;gap:5px 10px;padding:0 8px 7px 8px;align-items:center;
}
.fld{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--silk-dim)}
.fld > span{white-space:nowrap}
.fld select,.fld input{font-size:11.5px;padding:2px 5px}
.fld select{font-family:var(--mono)}
.pinsel{min-width:74px}
.iconbtn{
  width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:var(--r);color:var(--silk-mute);font-size:13px;flex:none;line-height:1;
}
.iconbtn:hover{background:var(--raise);color:var(--silk)}
.iconbtn.del:hover{background:#3a1b19;color:var(--alert)}

/* ブロック */
.blk{
  position:relative;border:1px solid var(--edge);border-radius:var(--r);
  background:var(--panel);border-left:3px solid var(--c,var(--gold));
  margin:0 0 3px 0;
}
.blk.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold-soft) inset}
.blk.dragging{opacity:.35}
.blk .row{display:flex;align-items:center;gap:5px;padding:4px 6px;flex-wrap:wrap;min-height:31px}
.blk .grip{cursor:grab;color:var(--silk-mute);font-size:12px;flex:none;letter-spacing:-2px;user-select:none}
.blk .ic{font-size:13px;flex:none}
.blk .lab{font-size:12.5px;white-space:nowrap}
.blk .tools{margin-left:auto;display:flex;gap:1px;flex:none}
.blk select,.blk input{font-size:11.5px;padding:2px 5px;max-width:200px}
.blk input[type=number]{width:66px}
.blk input[type=text]{min-width:90px}
.blk select{max-width:190px}
.blk .unit{font-size:11px;color:var(--silk-mute)}
.slot{margin:0 0 3px 16px;padding-left:9px;border-left:1px dashed var(--edge-hi)}
.slotlab{font-size:10px;color:var(--silk-mute);letter-spacing:.12em;padding:1px 0 2px 2px}

.dz{height:5px;margin:-1px 0;border-radius:3px;transition:none}
.dz.over{height:16px;background:var(--gold);opacity:.45;margin:2px 0}

/* ---------- 右カラム ---------- */
.rtabs{display:flex;flex:none;border-bottom:1px solid var(--edge);background:var(--mask);overflow-x:auto}
.rtabs button{
  padding:8px 11px;font-size:11.5px;white-space:nowrap;color:var(--silk-mute);
  border-bottom:2px solid transparent;letter-spacing:.06em;
}
.rtabs button.on{color:var(--gold);border-bottom-color:var(--gold);background:var(--panel)}
.rpane{display:none;flex:1;min-height:0;flex-direction:column}
.rpane.on{display:flex}

.codebar{
  flex:none;display:flex;align-items:center;gap:6px;padding:6px 9px;
  border-bottom:1px solid var(--edge);background:var(--panel);font-size:10.5px;
  color:var(--silk-mute);font-family:var(--mono);
}
.codebar .spacer{flex:1}
.minibtn{
  padding:3px 8px;border:1px solid var(--edge-hi);border-radius:var(--r);
  font-size:11px;color:var(--silk-dim);background:var(--mask);font-family:var(--sans);
}
.minibtn:hover{color:var(--silk);border-color:var(--gold-soft)}
pre.code{
  flex:1;overflow:auto;margin:0;padding:10px 12px 40px;
  font-family:var(--mono);font-size:11.7px;line-height:1.62;
  white-space:pre;tab-size:4;background:#080c0d;
}
.k{color:var(--violet)}   /* キーワード */
.s{color:var(--trace)}    /* 文字列 */
.n{color:var(--orange)}   /* 数値 */
.c{color:#4e6163;font-style:italic} /* コメント */
.f{color:var(--signal)}   /* 関数・属性 */
.b{color:var(--gold)}     /* 組み込み */

.rbody{flex:1;overflow-y:auto;padding:11px 12px 60px}
.card{
  border:1px solid var(--edge);border-radius:var(--r);background:var(--panel);
  padding:9px 10px;margin-bottom:9px;
}
.card h4{
  font-size:11px;letter-spacing:.14em;color:var(--gold);margin-bottom:6px;
  font-family:var(--mono);display:flex;align-items:center;gap:6px;
}
.card p{font-size:12px;color:var(--silk-dim);margin-bottom:4px}
.card ul{margin:0 0 2px 16px;font-size:12px;color:var(--silk-dim)}
.card li{margin-bottom:2px}
.kv{display:flex;gap:7px;font-size:11.5px;padding:2px 0;border-bottom:1px dashed #1e2a2b}
.kv:last-child{border-bottom:none}
.kv b{font-family:var(--mono);color:var(--silk);font-weight:600;flex:none;min-width:64px}
.kv span{color:var(--silk-dim)}
code.inl{font-family:var(--mono);background:var(--mask);border:1px solid var(--edge);
  border-radius:2px;padding:0 4px;font-size:11px;color:var(--gold)}

.warnbox{
  border:1px solid #5a2f2b;background:#20100f;border-radius:var(--r);
  padding:7px 9px;margin-bottom:8px;font-size:11.5px;color:#f0a49e;
}
.warnbox b{color:var(--alert)}
.errbox{
  border:1px solid var(--alert);background:#2a0f0d;border-radius:var(--r);
  padding:8px 10px;margin-bottom:8px;font-size:11.5px;color:#ffc9c4;
  box-shadow:0 0 0 1px rgba(229,84,75,.18) inset;
}
.errbox b{color:#ff8078;letter-spacing:.04em}
.errbox p{color:#e59b95}
button.blocked{opacity:.5;border-color:#5a2f2b !important}
.okbox{
  border:1px solid #24463d;background:#0f1b18;border-radius:var(--r);
  padding:7px 9px;margin-bottom:8px;font-size:11.5px;color:#8fd8c2;
}

/* ---------- ピン配置ボード ---------- */
.boardwrap{display:flex;justify-content:center;padding:6px 0 12px}
.pcb{
  position:relative;width:272px;border-radius:9px;
  background:linear-gradient(160deg,#132321,#0b1413 60%);
  border:1px solid #2b3d3a;padding:26px 0 20px;
  box-shadow:0 8px 26px rgba(0,0,0,.6),0 0 0 1px rgba(217,164,65,.09);
}
.pcb .usb{
  position:absolute;top:-9px;left:50%;transform:translateX(-50%);
  width:44px;height:13px;background:linear-gradient(180deg,#b9c2c4,#7c8a8c);
  border-radius:2px 2px 0 0;
}
.pcb .chip{
  position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);z-index:0;
  width:60px;height:60px;border-radius:4px;
  background:linear-gradient(150deg,#232c2d,#12191a);border:1px solid #35494a;
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-family:var(--mono);font-size:8px;letter-spacing:.1em;color:#5d7275;line-height:1.5;
}
.pcb .silk{
  position:absolute;bottom:5px;left:0;right:0;text-align:center;
  font-family:var(--mono);font-size:8px;letter-spacing:.22em;color:#4b6062;
}
.pinrows{display:grid;grid-template-columns:1fr 1fr;gap:0 44px;padding:0 4px}
.pinrow{display:flex;align-items:center;gap:4px;height:15px;font-size:9px;font-family:var(--mono)}
.pinrow.r{flex-direction:row-reverse}
.pad{
  width:15px;height:11px;border-radius:2px;flex:none;
  background:linear-gradient(180deg,#c9a24a,#8d6d27);border:1px solid #5d4718;
  display:flex;align-items:center;justify-content:center;
  font-size:7px;color:#241a06;font-weight:700;
}
.pinrow .nm{color:#8ea0a0;white-space:nowrap;flex:1;min-width:0;letter-spacing:.02em;
  overflow:hidden;text-overflow:ellipsis}
.pinrow.r .nm{text-align:right}
.pinrow.pw .nm{color:#e08a7c}
.pinrow.gnd .nm{color:#6b7c7d}
.pinrow.used .nm{color:var(--tc,var(--trace));font-weight:700}
.pinrow.used .pad{background:linear-gradient(180deg,var(--tc,#3fbfa0),#0d1b18);border-color:var(--tc,#3fbfa0);color:#04100d}
.pinrow.conf .pad{background:linear-gradient(180deg,#f0796e,#5b1a15);border-color:var(--alert)}
.pinrow.conf .nm{color:var(--alert)}

.legend{display:flex;flex-wrap:wrap;gap:4px 9px;font-size:10.5px;margin-top:2px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:-1px}

/* ---------- モーダル ---------- */
.mask{
  position:fixed;inset:0;z-index:50;background:rgba(4,7,8,.78);
  display:none;align-items:center;justify-content:center;padding:16px;
}
.mask.on{display:flex}
.modal{
  width:min(620px,100%);max-height:84vh;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--edge-hi);border-radius:5px;
  box-shadow:0 20px 60px rgba(0,0,0,.7);
}
.modal header{
  padding:11px 14px;border-bottom:1px solid var(--edge);display:flex;align-items:center;gap:9px;
}
.modal header h3{font-size:13px;letter-spacing:.1em}
.modal header .spacer{flex:1}
.modal .mbody{padding:13px 14px;overflow-y:auto;font-size:12.5px;color:var(--silk-dim)}
.modal .mfoot{padding:10px 14px;border-top:1px solid var(--edge);display:flex;gap:8px;justify-content:flex-end}
.tplgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tpl{
  text-align:left;padding:9px 10px;border:1px solid var(--edge);border-radius:var(--r);
  background:var(--mask-2);border-left:3px solid var(--gold);
}
.tpl:hover{background:var(--raise);border-color:var(--edge-hi);border-left-color:var(--gold)}
.tpl b{display:block;font-size:12.5px;margin-bottom:2px;color:var(--silk)}
.tpl small{font-size:10.5px;color:var(--silk-mute);line-height:1.4;display:block}

.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(14px);
  background:#1d2a2b;border:1px solid var(--gold-soft);border-radius:4px;
  padding:8px 15px;font-size:12.5px;z-index:80;opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s;box-shadow:0 8px 24px rgba(0,0,0,.5);
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- モバイル ---------- */
.mobnav{display:none}
@media (max-width:1080px){
  .stage{grid-template-columns:212px minmax(0,1fr) 340px}
}
@media (max-width:900px){
  body{overflow:auto}
  .stage{display:block;height:calc(100% - var(--hdr) - 46px)}
  .col{display:none;height:100%}
  .col.show{display:flex}
  .col.left,.col.right{border:none}
  .mobnav{
    display:grid;grid-template-columns:repeat(3,1fr);height:46px;flex:none;
    border-top:1px solid var(--edge);background:var(--panel);position:relative;z-index:6;
  }
  .mobnav button{font-size:11px;color:var(--silk-mute);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:1px;letter-spacing:.06em}
  .mobnav button .g{font-size:15px}
  .mobnav button.on{color:var(--gold);background:var(--raise)}
  .brand .sub{display:none}
  .brand h1{font-size:12.5px;letter-spacing:.1em}
  .topbar{gap:7px;padding:0 8px}
  .topbar .spacer{display:none}
  .projname{min-width:60px;flex:1;max-width:none;padding:5px 7px}
  .tbtn{padding:6px 8px}
  .tbtn span.t{display:none}
  .modal{max-height:90vh}
  .tplgrid{grid-template-columns:1fr}
}
@media (max-width:560px){
  .brand h1{display:none}
  .chipmark{width:22px;height:22px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="chipmark" aria-hidden="true"></div>
    <div>
      <h1>PICO CIRCUITPYTHON</h1>
      <div class="sub">BLOCK BUILDER</div>
    </div>
  </div>

  <input class="projname" id="projName" value="はじめてのPico" aria-label="プロジェクト名" maxlength="40">

  <div class="spacer"></div>

  <button class="tbtn" id="btnTemplates" title="サンプルを読み込む">📐<span class="t">サンプル</span></button>
  <button class="tbtn" id="btnHelp" title="使い方">❓<span class="t">使い方</span></button>
  <button class="tbtn" id="btnSave" title="プロジェクトを保存">💾<span class="t">保存</span></button>
  <button class="tbtn" id="btnLoad" title="プロジェクトを開く">📂<span class="t">開く</span></button>
  <button class="tbtn primary" id="btnDownload" title="code.py をダウンロード">⬇<span class="t">code.py</span></button>
  <input type="file" id="fileInput" accept=".json,application/json" hidden>
</header>

<div class="stage">

  <!-- ========== 左: パレット ========== -->
  <div class="col left" id="colLeft">

/* ---------------------------------------------------------------- ピン定義 */
const PIN_LEFT = ["GP0","GP1","GND","GP2","GP3","GP4","GP5","GND","GP6","GP7",
                  "GP8","GP9","GND","GP10","GP11","GP12","GP13","GND","GP14","GP15"];
const PIN_RIGHT = ["VBUS","VSYS","GND","3V3_EN","3V3(OUT)","ADC_VREF","GP28","AGND","GP27","GP26",
                   "RUN","GP22","GND","GP21","GP20","GP19","GP18","GND","GP17","GP16"];

const GP_ALL = [];
for (let i = 0; i <= 22; i++) GP_ALL.push("GP" + i);
GP_ALL.push("GP26", "GP27", "GP28");
const GP_ADC = ["GP26", "GP27", "GP28"];

const UART_MAP = { GP0:"UART0 TX", GP1:"UART0 RX", GP4:"UART1 TX", GP5:"UART1 RX",
                   GP8:"UART1 TX", GP9:"UART1 RX", GP12:"UART0 TX", GP13:"UART0 RX",
                   GP16:"UART0 TX", GP17:"UART0 RX", GP20:"UART1 TX", GP21:"UART1 RX" };

function gpNum(p){ return parseInt(String(p).replace("GP",""), 10); }
function pinI2C(p){
  const n = gpNum(p); if (isNaN(n)) return null;
  const bus = ((n >> 1) % 2 === 0) ? 0 : 1;
  return "I2C" + bus + " " + (n % 2 === 0 ? "SDA" : "SCL");
}
/* SDA になれるピン（偶数GP） */
function i2cSDAList(){ return GP_ALL.filter(p => /SDA$/.test(pinI2C(p) || "")); }
/* その SDA と同じバスで組める SCL 候補 */
function i2cPartners(sda){
  const f = pinI2C(sda) || "";
  if (!/SDA$/.test(f)) return [];
  const bus = f.slice(0, 4);
  return GP_ALL.filter(p => (pinI2C(p) || "") === bus + " SCL");
}
function pinSPI(p){
  const n = gpNum(p); if (isNaN(n)) return null;
  const bus = (Math.floor(n / 8) % 2 === 0) ? 0 : 1;
  const fn = ["RX(MISO)","CSn","SCK","TX(MOSI)"][n % 4];
  return "SPI" + bus + " " + fn;
}
function pinPWM(p){
  const n = gpNum(p); if (isNaN(n)) return null;
  return "PWM" + Math.floor((n % 16) / 2) + (n % 2 === 0 ? "A" : "B");
}
function pinFuncs(p){
  const f = [];
  if (GP_ADC.includes(p)) f.push("ADC" + (gpNum(p) - 26));
  f.push(pinPWM(p)); f.push(pinI2C(p)); f.push(pinSPI(p));
  if (UART_MAP[p]) f.push(UART_MAP[p]);
  return f.filter(Boolean);
}

/* ============================================================================
   状態
   ============================================================================ */
let UID = 1;
const uid = () => "u" + (UID++) + Math.floor(Math.random() * 900 + 100);

const state = {
  name: "はじめてのPico",
  i2c: { sda: "GP0", scl: "GP1" },
  parts: [],
  vars: [],
  setup: [],
  loop: []
};

/* ------------------------------------------------------------ 参照ヘルパー */
function partByUid(u){ return state.parts.find(p => p.uid === u) || null; }
function partOf(b){ return partByUid(b.p && b.p._part); }
function pv(b){ const P = partOf(b); return P ? P.name : "part"; }
function varByUid(u){ return state.vars.find(v => v.uid === u) || null; }
function varName(u){ const v = varByUid(u); return v ? v.name : null; }
function partDef(p){ return PARTS[p.type]; }
/* サーボの可動範囲。部品カードの設定に合わせる（180 / 270） */
function servoRange(b){
  const P = partOf(b);
  const r = P && P.opts ? parseInt(P.opts.range, 10) : 180;
  return isFinite(r) ? r : 180;
}
function callable(x, ...a){ return typeof x === "function" ? x(...a) : (x || []); }

/* ------------------------------------------------------------ Python 生成 */
function ind(lines){ return lines.map(l => "    " + l); }
/* インデントの中身。コメントや空行だけだと Python が通らないので pass を足す */
function bodyOf(lines){
  const has = (lines || []).some(l => l.trim() && !l.trim().startsWith("#"));
  return has ? lines : [...(lines || []), "pass"];
}
function num(x){
  const n = Number(x);
  if (!isFinite(n)) return "0";
  return Number.isInteger(n) ? String(n) : String(parseFloat(n.toFixed(4)));
}
function int(x){
  const raw = (x && typeof x === "object" && "v" in x) ? x.v : x;
  const n = parseInt(raw, 10);
  return isFinite(n) ? String(n) : "0";
}
function pyStr(s){
  return '"' + String(s == null ? "" : s)
    .replace(/\\/g, "\\\\").replace(/"/g, '\\"')
    .replace(/\n/g, "\\n").replace(/\r/g, "") + '"';
}
/* コメント行に埋める文字列。改行が入ると次の行がPythonコードとして解釈されて壊れる */
function pyComment(s){
  return String(s == null ? "" : s)
    .replace(/\r/g, "")
    .replace(/[\n\u2028\u2029]+/g, " ")
    .trim();
}

/* ---- 名前として使えない語 ---------------------------------------------- */
/* Python の予約語 */
const NG_KEYWORD = ["False","None","True","and","as","assert","async","await","break","class",
  "continue","def","del","elif","else","except","finally","for","from","global","if","import",
  "in","is","lambda","nonlocal","not","or","pass","raise","return","try","while","with","yield"];
/* 生成コードが import するモジュール名・別名 */
const NG_MODULE = ["time","board","busio","digitalio","analogio","pwmio","touchio","rotaryio",
  "microcontroller","random","math","displayio","i2cdisplaybus","terminalio","usb_hid",
  "neopixel","adafruit_dht","adafruit_hcsr04","adafruit_mpu6050","adafruit_bme280",
  "adafruit_displayio_ssd1306","adafruit_character_lcd","adafruit_hid","adafruit_motor",
  "adafruit_display_text","label","servo_lib","motor_lib","character_lcd",
  "Keyboard","Keycode","KeyboardLayoutUS","Mouse"];
/* 生成コードが組み立てる名前 */
const NG_GLOBAL = ["i2c"];
/* うっかり潰すと困る組み込み */
const NG_BUILTIN = ["print","int","float","str","bool","len","range","min","max","abs","round",
  "list","dict","set","tuple","sum","sorted","type","input","open","bytes","id","map","filter"];
const NG_NAMES = new Set([...NG_KEYWORD, ...NG_MODULE, ...NG_GLOBAL, ...NG_BUILTIN]);
/* 部品の setup が `名前_○○` という補助変数を作るので、その分も衝突する */
const NAME_SUFFIX = ["_pwm","_bus","_r","_g","_b","_set","_tone","_read","_layout","_last","_prev","_group","_label"];

function nameProblem(n){
  if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(n))
    return `名前「${n}」は使えません。半角英字か _ で始め、あとは英数字と _ だけにしてください。`;
  if (NG_KEYWORD.includes(n))
    return `名前「${n}」は Python の予約語なので使えません。別の名前にしてください。`;
  if (NG_MODULE.includes(n) || NG_GLOBAL.includes(n))
    return `名前「${n}」はプログラムが内部で使う名前と重なります（${n} を上書きしてしまい、実行中に止まります）。別の名前にしてください。`;
  if (NG_BUILTIN.includes(n))
    return `名前「${n}」は Python の基本の関数と同じです。別の名前にしてください。`;
  return null;
}
/* 使えない名前を、意味が分かる形に直す */
function safeName(raw, taken){
  let n = String(raw == null ? "" : raw).trim()
    .replace(/[^A-Za-z0-9_]+/g, "_")
    .replace(/_+/g, "_")
    .replace(/_+$/, "");
  if (!n) n = "name";
  if (/^[0-9]/.test(n)) n = "_" + n;
  if (NG_NAMES.has(n)) n = n + "_1";
  const used = new Set(taken || []);
  const reserved = new Set();
  used.forEach(u => NAME_SUFFIX.forEach(s => reserved.add(u + s)));
  let out = n, i = 2;
  while (used.has(out) || reserved.has(out) || NG_NAMES.has(out)) { out = n + "_" + (i++); }
  return out;
}
/* 全部の名前をまとめて直す（読み込み時・入力確定時に呼ぶ） */
function fixAllNames(){
  const taken = [];
  let changed = false;
  const fix = (o) => {
    const s = safeName(o.name, taken);
    if (s !== o.name) { o.name = s; changed = true; }
    taken.push(s);
  };
  state.parts.forEach(fix);
  state.vars.forEach(fix);
  return changed;
}
function hex2rgb(h){
  const m = /^#?([0-9a-f]{6})$/i.exec(String(h || "#ffffff"));
  const v = m ? parseInt(m[1], 16) : 0xffffff;
  return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
}

/* 値のもと（センサー・変数）を Python 式にする */
function srcExpr(s){
  if (!s) return null;
  if (s.startsWith("v:")) { const n = varName(s.slice(2)); return n; }
  if (s.startsWith("p:")) {
    const [, pu, key] = s.split(":");
    const P = partByUid(pu); if (!P) return null;
    const rd = readsOf(P).find(r => r.k === key); if (!rd) return null;
    return rd.expr(P.name);
  }
  return null;
}
function readsOf(P){
  const d = PARTS[P.type]; if (!d) return [];
  return callable(d.reads, P) || [];
}
/* 数値パラメータ（直接入力 or 値のもと） */
function valExpr(pm){
  if (pm && typeof pm === "object") {
    if (pm.s) { const e = srcExpr(pm.s); if (e) return e; }
    return num(pm.v);
  }
  return num(pm);
}
/* 条件式 */
function condExpr(c){
  if (!c || !c.src) return "True";
  if (c.src.startsWith("v:")) {
    const n = varName(c.src.slice(2));
    if (!n) return "True";
    return `${n} ${c.op || ">"} ${valExpr(c.val)}`;
  }
  const [, pu, key] = c.src.split(":");
  const P = partByUid(pu); if (!P) return "True";
  const rd = readsOf(P).find(r => r.k === key); if (!rd) return "True";
  const e = rd.expr(P.name);
  if (rd.kind === "bool") return c.op === "not" ? `not (${e})` : e;
  return `${e} ${c.op || ">"} ${valExpr(c.val)}`;
}

/* ------------------------------------------------------------ ピンの使用状況 */
function pinUsage(){
  const map = {};
  state.parts.forEach((P, idx) => {
    const d = PARTS[P.type]; if (!d) return;
    (d.pins || []).forEach(pd => {
      const pin = P.pins[pd.k]; if (!pin) return;
      (map[pin] = map[pin] || []).push({ part:P, label:pd.label, color:WIRE_COLORS[idx % WIRE_COLORS.length] });
    });
    if (d.bus === "i2c") {
      [["sda","SDA"],["scl","SCL"]].forEach(([k, lb]) => {
        const pin = state.i2c[k];
        (map[pin] = map[pin] || []).push({ part:P, label:lb, color:WIRE_COLORS[idx % WIRE_COLORS.length], shared:true });
      });
    }
  });
  return map;
}
function partColor(P){
  const i = state.parts.indexOf(P);
  return WIRE_COLORS[(i < 0 ? 0 : i) % WIRE_COLORS.length];
}
function usesI2C(){ return state.parts.some(P => PARTS[P.type] && PARTS[P.type].bus === "i2c"); }

/* ------------------------------------------------------------ コード生成本体 */
function genList(list, g){
  const out = [];
  for (const b of list) {
    const def = BLOCKS[b.type];
    if (!def) continue;
    if (def.part && !partOf(b)) {
      g.warns.push(`「${def.label}」ブロックの部品が見つかりません。部品を選び直してください。`);
      continue;
    }
    (callable(def.imports) || []).forEach(i => g.imports.add(i));
    (callable(def.froms) || []).forEach(i => g.froms.add(i));
    (callable(def.libs) || []).forEach(i => g.libs.add(i));
    if (def.helper) { const h = def.helper(b); if (h) g.helpers.set(h.key, h.lines); }
    (def.params || []).forEach(pm => {
      if (pm.type === "var" && !varName(b.p[pm.k]))
        g.warns.push(`「${def.label}」ブロックで使う変数が決まっていません。変数を追加して選んでください。`);
    });

    if (def.slots) {
      const k1 = genList(b.c[def.slots[0].k] || [], g);
      const k2 = def.slots[1] ? genList(b.c[def.slots[1].k] || [], g) : [];
      out.push(...def.wrap(b, g, bodyOf(k1), bodyOf(k2)));
    } else {
      out.push(...(def.code(b, g) || []));
    }
  }
  return out;
}

function generate(){
  /* warns = 直したほうがよい / errs = そのままでは動かない（書き出しを止める） */
  const g = { imports:new Set(), froms:new Set(), libs:new Set(),
              helpers:new Map(), pre:[], warns:[], errs:[] };

  /* --- 部品の初期化 --- */
  const partLines = [];
  state.parts.forEach(P => {
    const d = PARTS[P.type]; if (!d) return;
    (callable(d.imports, P) || []).forEach(i => g.imports.add(i));
    (callable(d.froms, P) || []).forEach(i => g.froms.add(i));
    (callable(d.libs, P) || []).forEach(i => g.libs.add(i));
    (d.pre || []).forEach(l => { if (!g.pre.includes(l)) g.pre.push(l); });
    const lines = callable(d.setup, P, P.name) || [];
    if (lines.length) {
      partLines.push(`# ${d.name}（${P.name}）`);
      partLines.push(...lines);
      partLines.push("");
    }
    (callable(d.helpers, P, P.name) || []).forEach(h => g.helpers.set(h.key, h.lines));
  });

  /* --- I2C バス --- */
  const i2cLines = [];
  if (usesI2C()) {
    g.imports.add("board"); g.imports.add("busio");
    /* Pico のピンは役割が固定。偶数GP=SDA / 奇数GP=SCL で、同じバス番号どうしでしか組めない */
    const fs = pinI2C(state.i2c.sda) || "", fc = pinI2C(state.i2c.scl) || "";
    if (!/SDA$/.test(fs)) {
      g.errs.push(`SDA に ${state.i2c.sda} は使えません。SDA になれるのは番号が偶数のピンだけです（${i2cSDAList().slice(0, 6).join(" / ")} など）。`);
    } else if (!/SCL$/.test(fc)) {
      g.errs.push(`SCL に ${state.i2c.scl} は使えません。SCL になれるのは番号が奇数のピンだけです。SDA=${state.i2c.sda} なら ${i2cPartners(state.i2c.sda).join(" / ")} から選んでください。`);
    } else if (fs.slice(0, 4) !== fc.slice(0, 4)) {
      g.errs.push(`SDA=${state.i2c.sda}（${fs}）と SCL=${state.i2c.scl}（${fc}）は別のI2Cバスのピンなので組み合わせられません。SDA=${state.i2c.sda} なら ${i2cPartners(state.i2c.sda).join(" / ")} から選んでください。`);
    }
    i2cLines.push("# I2C（SDA / SCL を共有する部品ぜんぶで使います）");
    i2cLines.push(`i2c = busio.I2C(board.${state.i2c.scl}, board.${state.i2c.sda})`);
    i2cLines.push("");
  }

  /* --- 本体 --- */
  const setupLines = genList(state.setup, g);
  const loopLines  = genList(state.loop, g);

  /* --- 変数 --- */
  const varLines = [];
  if (state.vars.length) {
    varLines.push("# おぼえておく数");
    state.vars.forEach(v => {
      let init = v.init;
      if (v.kind === "text") init = pyStr(v.init);
      else if (v.kind === "bool") init = (String(v.init) === "true" || v.init === true) ? "True" : "False";
      else init = num(v.init);
      varLines.push(`${v.name} = ${init}`);
    });
    varLines.push("");
  }

  /* ループが空のときは下のプレースホルダが time.sleep(1) を使う。
     そこまで含めて「time. が本当に出てくるか」で判定する */
  const loopBody = bodyOf(loopLines.length ? loopLines
    : ["# 左のパレットから動作ブロックを追加してください", "time.sleep(1)"]);
  const helperText = [...g.helpers.values()].map(a => a.join("\n")).join("\n");
  const scan = [partLines.join("\n"), helperText, setupLines.join("\n"), loopBody.join("\n")].join("\n");
  if (/\btime\s*\./.test(scan)) g.imports.add("time");

  /* --- import 文の整列 --- */
  const order = ["time","board","busio","digitalio","analogio","pwmio","touchio","rotaryio",
                 "microcontroller","random","math","displayio","i2cdisplaybus","terminalio",
                 "usb_hid","neopixel","adafruit_dht","adafruit_hcsr04","adafruit_mpu6050"];
  const imp = [...g.imports].sort((a, b) => {
    const ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
  });

  /* --- 警告 --- */
  const usage = pinUsage();
  Object.entries(usage).forEach(([pin, list]) => {
    const uniq = new Set(list.map(x => x.part.uid + "/" + x.label));
    if (uniq.size > 1 && !list.every(x => x.shared)) {
      g.warns.push(`ピン ${pin} を ${list.map(x => x.part.name).join(" と ")} が同時に使っています。どちらかを変えてください。`);
    }
  });
  state.parts.forEach(P => {
    const d = PARTS[P.type]; if (!d) return;
    (d.pins || []).forEach(pd => {
      if (pd.sel.kind === "adc" && !GP_ADC.includes(P.pins[pd.k])) {
        g.warns.push(`${P.name} の「${pd.label}」はアナログ入力なので GP26 / GP27 / GP28 のどれかにしてください。`);
      }
    });
  });
  const names = state.parts.map(p => p.name).concat(state.vars.map(v => v.name));
  names.forEach((n, i) => {
    if (names.indexOf(n) !== i) g.errs.push(`名前「${n}」が重複しています。別の名前にしてください。`);
    const prob = nameProblem(n);
    if (prob) g.errs.push(prob);
    /* 部品は 名前_pwm のような補助変数も作るので、そこも見る */
    NAME_SUFFIX.forEach(s => {
      if (names.indexOf(n + s) >= 0)
        g.errs.push(`名前「${n + s}」は「${n}」が内部で作る名前と重なります。どちらかを変えてください。`);
    });
  });

  /* --- 組み立て --- */
  const L = [];
  const stamp = new Date().toLocaleDateString("ja-JP");
  L.push("# " + "-".repeat(46));
  L.push(`# code.py : ${pyComment(state.name)}`);
  L.push("# Raspberry Pi Pico + CircuitPython 9 以降");
  L.push(`# PICO CIRCUITPYTHON BLOCK BUILDER (${stamp})`);
  L.push("# " + "-".repeat(46));
  L.push("");
  imp.forEach(i => L.push(`import ${i}`));
  [...g.froms].forEach(f => L.push(f));
  L.push("");
  if (g.pre.length) { L.push(...g.pre); L.push(""); }
  if (i2cLines.length) L.push(...i2cLines);
  if (partLines.length) { L.push("# --- つかう部品の準備 ---"); L.push(...partLines); }
  if (g.helpers.size) {
    L.push("# --- 便利な関数 ---");
    g.helpers.forEach(lines => { L.push(...lines); L.push(""); });
  }
  if (varLines.length) L.push(...varLines);
  if (setupLines.length) { L.push("# --- はじめに1回だけ ---"); L.push(...setupLines); L.push(""); }
  L.push("# --- ずっとくり返す ---");
  L.push("while True:");
  L.push(...ind(loopBody));
  L.push("");

  return { code: L.join("\n"), libs:[...g.libs],
           warns:[...new Set(g.warns)], errs:[...new Set(g.errs)],
           imports: imp.concat([...g.froms]) };
}

/* ------------------------------------------------------------ 色付け表示 */
const PY_KW = ["while","for","in","if","elif","else","def","return","import","from","as","not",
               "and","or","break","continue","pass","global","try","except","True","False","None","with"];
function highlight(src){
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const re = /(#[^\n]*)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(\b\d+\.?\d*\b|\b0x[0-9a-fA-F]+\b)|(\b[A-Za-z_][A-Za-z0-9_]*\b)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src)) !== null) {
    out += esc(src.slice(last, m.index));
    if (m[1]) out += `<span class="c">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="s">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="n">${esc(m[3])}</span>`;
    else {
      const w = m[4];
      if (PY_KW.includes(w)) out += `<span class="k">${w}</span>`;
      else if (["print","int","str","len","range","round","max","min","abs","float"].includes(w)) out += `<span class="b">${w}</span>`;
      else if (src[m.index + w.length] === "(") out += `<span class="f">${w}</span>`;
      else out += w;
    }
    last = m.index + m[0].length;
  }
  out += esc(src.slice(last));
  return out;
}

/* ============================================================================
   画面描画
   ============================================================================ */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const CATCOL = { flow:"#a98cf0", var:"#ef7fae" };

function opts(list, cur){
  return list.map(o => {
    const l = Array.isArray(o) ? o[0] : o.l, v = Array.isArray(o) ? o[1] : o.v;
    return `<option value="${esc(v)}"${String(v) === String(cur) ? " selected" : ""}>${esc(l)}</option>`;
  }).join("");
}

/* 値のもと（センサー・変数）の選択肢 */
function sourceOptions(cur, firstLabel){
  let h = `<option value="">${esc(firstLabel)}</option>`;
  const sens = [];
  state.parts.forEach(P => readsOf(P).filter(r => r.kind !== "bool")
    .forEach(r => sens.push([`${P.name} ${r.label}`, `p:${P.uid}:${r.k}`])));
  if (sens.length) h += `<optgroup label="センサー">${opts(sens, cur)}</optgroup>`;
  if (state.vars.length) h += `<optgroup label="変数">${opts(state.vars.map(v => [v.name, "v:" + v.uid]), cur)}</optgroup>`;
  return h;
}

/* ---------------------------------------------------------------- パレット */
let palTab = "parts", palQ = "";
function renderPalette(){
  const q = palQ.trim().toLowerCase();
  const hit = (t) => !q || t.toLowerCase().includes(q);
  let h = "";

  if (palTab === "parts") {
    const cats = ["出力","入力","表示","通信"];
    cats.forEach(cat => {
      const items = Object.entries(PARTS)
        .filter(([, d]) => d.cat === cat && (hit(d.name) || hit(d.desc)));
      if (!items.length) return;
      h += `<div class="palgroup"><h3>${cat}</h3>`;
      items.forEach(([id, d]) => {
        h += `<button class="palitem" data-addpart="${id}" draggable="false" style="--c:var(${d.color})">
          <span class="ic">${d.icon}</span>
          <span class="tx"><b>${esc(d.name)}</b><small>${esc(d.desc)}</small></span></button>`;
      });
      h += `</div>`;
    });
    if (!h) h = `<div class="palgroup"><p style="font-size:12px;color:var(--silk-mute)">見つかりません</p></div>`;
  } else {
    const groups = [
      ["基本", ["wait","wait_ms","print_out","comment"]],
      ["くり返し・条件", ["repeat_n","if_then","if_else","while_cond","break_loop"]],
      ["変数", ["var_set","var_change","var_random"]]
    ];
    groups.forEach(([title, ids]) => {
      const items = ids.filter(id => BLOCKS[id] && (hit(BLOCKS[id].label) || hit(title)));
      if (!items.length) return;
      h += `<div class="palgroup"><h3>${title}</h3>`;
      items.forEach(id => {
        const d = BLOCKS[id];
        h += `<button class="palitem" data-addblk="${id}" draggable="true" style="--c:${CATCOL[d.cat] || "#d9a441"}">
          <span class="ic">${d.icon}</span><span class="tx"><b>${esc(d.label)}</b></span></button>`;
      });
      h += `</div>`;
    });

    state.parts.forEach(P => {
      const d = PARTS[P.type]; if (!d) return;
      const acts = (callable(d.acts, P) || []).filter(a => BLOCKS[a]);
      if (!acts.length) return;
      const shown = acts.filter(a => hit(BLOCKS[a].label) || hit(P.name) || hit(d.name));
      if (!shown.length) return;
      h += `<div class="palgroup"><h3>${esc(P.name)} — ${esc(d.name)}</h3>`;
      shown.forEach(a => {
        h += `<button class="palitem" data-addblk="${a}" data-part="${P.uid}" draggable="true" style="--c:${partColor(P)}">
          <span class="ic">${BLOCKS[a].icon}</span><span class="tx"><b>${esc(BLOCKS[a].label)}</b></span></button>`;
      });
      h += `</div>`;
    });

    const withReads = state.parts.filter(P => readsOf(P).length);
    if (withReads.length && !q) {
      h += `<div class="palgroup"><h3>センサーの値の使い方</h3>
        <p style="font-size:11px;color:var(--silk-mute);padding:0 2px 6px">
        「もし〜なら」の条件や、数値のらんの横にあるメニューから、
        ${esc(withReads.map(p => p.name).join(" / "))} の値をそのまま選べます。</p></div>`;
    }
    if (!state.parts.length) {
      h += `<div class="palgroup"><p style="font-size:11.5px;color:var(--silk-mute);padding:2px">
        「🔌 部品」タブから部品を追加すると、その部品を動かすブロックがここに増えます。</p></div>`;
    }
  }
  $("#palBody").innerHTML = h;
}

/* ------------------------------------------------------------ 部品カード */
function pinOptions(kind, cur, usedMap){
  const list = kind === "adc" ? GP_ADC : GP_ALL;
  return list.map(p => {
    let lb = p;
    if (GP_ADC.includes(p)) lb += ` (ADC${gpNum(p) - 26})`;
    if (usedMap[p] && p !== cur) lb += " ●使用中";
    return `<option value="${p}"${p === cur ? " selected" : ""}>${lb}</option>`;
  }).join("");
}

    h += `<div class="partcard" style="--c:var(--trace)">
      <div class="ph"><span class="ic">🔗</span><span class="ty" style="flex:1">

      <div class="pb">
        <label class="fld"><span>SDA</span><select class="pinsel" data-i2c="sda">${pinOptions("gp", state.i2c.sda, {})}</select></label>

      </div></div>`;

      <div class="ph">
        <span class="ic">${d.icon}</span>
        <input class="nm" data-pname="${P.uid}" value="${esc(P.name)}" spellcheck="false" title="プログラムの中での名前">
        <span class="ty">${esc(d.name)}</span>
        <button class="iconbtn" data-pmove="${P.uid}|-1" title="上へ">▲</button>
        <button class="iconbtn" data-pmove="${P.uid}|1" title="下へ">▼</button>
        <button class="iconbtn del" data-pdel="${P.uid}" title="削除">✕</button>
      </div><div class="pb">`;

      h += `<label class="fld"><span>${esc(pd.label)}</span>
        <select class="pinsel" data-ppin="${P.uid}|${pd.k}">${pinOptions(pd.sel.kind, P.pins[pd.k], used)}</select></label>`;
    });
    (d.opts || []).forEach(od => {
      const v = P.opts[od.k];
      if (od.type === "bool") {
        h += `<label class="fld"><input type="checkbox" data-popt="${P.uid}|${od.k}"${v ? " checked" : ""}><span>${esc(od.label)}</span></label>`;
      } else if (od.type === "sel") {
        h += `<label class="fld"><span>${esc(od.label)}</span>
          <select data-popt="${P.uid}|${od.k}">${opts(od.options, v)}</select></label>`;
      } else {
        h += `<label class="fld"><span>${esc(od.label)}</span>
          <input type="number" style="width:64px" data-popt="${P.uid}|${od.k}" value="${esc(v)}"
          ${od.min != null ? `min="${od.min}"` : ""} ${od.max != null ? `max="${od.max}"` : ""}></label>`;

/* ------------------------------------------------------------ ブロック描画 */
function dz(root, parentUid, slot, index){
  return `<div class="dz" data-dz="${root}|${parentUid || ""}|${slot || ""}|${index}"></div>`;
}

function renderParam(b, pm){
  const key = `${b.uid}|${pm.k}`;
  const val = b.p[pm.k];
  switch (pm.type) {
    case "num": case "int": {
      const o = (val && typeof val === "object") ? val : { v: val, s: "" };
      /* min / max は部品の設定によって変わることがあるので関数も許す */
      const lo = typeof pm.min === "function" ? pm.min(b) : pm.min;
      const hi = typeof pm.max === "function" ? pm.max(b) : pm.max;
      let h = "";
      if (!o.s) {
        h += `<input type="number" data-bnum="${key}" value="${esc(o.v)}"
          ${lo != null ? `min="${lo}"` : ""} ${hi != null ? `max="${hi}"` : ""}
          step="${pm.type === "int" ? 1 : (pm.step || 1)}">`;
      }
      if (pm.src) h += `<select data-bsrc="${key}" title="センサーや変数の値を使う">${sourceOptions(o.s, "🔢 数値")}</select>`;
      return h;
    }
    case "text":
      return `<input type="text" data-btext="${key}" value="${esc(val)}" style="width:${pm.w || 120}px">`;
    case "sel":
      return `<select data-bsel="${key}">${opts(pm.options, val)}</select>`;
    case "color":
      return `<input type="color" data-bcol="${key}" value="${esc(val)}" style="width:34px;height:21px;padding:0;border:1px solid var(--edge)">`;
    case "var": {
      if (!state.vars.length) return `<span class="unit" style="color:var(--alert)">← 変数を追加してください</span>`;
      return `<select data-bvar="${key}">${opts(state.vars.map(v => [v.name, v.uid]), val)}</select>`;
    }
    case "valsrc":
      return `<select data-bvs="${key}">${sourceOptions(val, "（文字だけ）")}</select>`;
    case "cond": {
      const c = val || { src:"", op:">", val:{ v:0, s:"" } };
      const boolSrc = [], numSrc = [];
      state.parts.forEach(P => readsOf(P).forEach(r => {
        (r.kind === "bool" ? boolSrc : numSrc).push([`${P.name} ${r.label}`, `p:${P.uid}:${r.k}`]);
      }));
      let sh = `<option value="">いつでも</option>`;
      if (boolSrc.length) sh += `<optgroup label="スイッチ・センサー">${opts(boolSrc, c.src)}</optgroup>`;
      if (numSrc.length) sh += `<optgroup label="数値センサー">${opts(numSrc, c.src)}</optgroup>`;
      if (state.vars.length) sh += `<optgroup label="変数">${opts(state.vars.map(v => [v.name, "v:" + v.uid]), c.src)}</optgroup>`;
      let h = `<select data-bcsrc="${b.uid}|${pm.k}">${sh}</select>`;
      const kind = condKind(c.src);
      if (kind === "bool") {
        h += `<select data-bcop="${b.uid}|${pm.k}">${opts([["である",""],["でない","not"]], c.op)}</select>`;
      } else if (kind === "num") {
        h += `<select data-bcop="${b.uid}|${pm.k}">${opts([["＞ より大きい",">"],["≧ 以上",">="],["＜ より小さい","<"],["≦ 以下","<="],["＝ と同じ","=="],["≠ ちがう","!="]], c.op)}</select>`;
        const o = c.val || { v:0, s:"" };
        if (!o.s) h += `<input type="number" data-bcval="${b.uid}|${pm.k}" value="${esc(o.v)}" step="any">`;
        h += `<select data-bcvsrc="${b.uid}|${pm.k}">${sourceOptions(o.s, "🔢 数値")}</select>`;
      }
      return h;
    }
  }
  return "";
}
function condKind(src){
  if (!src) return null;
  if (src.startsWith("v:")) return "num";
  const [, pu, key] = src.split(":");
  const P = partByUid(pu); if (!P) return null;
  const r = readsOf(P).find(x => x.k === key);
  return r ? (r.kind === "bool" ? "bool" : "num") : null;
}

function renderBlock(b, root, parentUid, slot){
  const d = BLOCKS[b.type];
  if (!d) return "";
  const P = d.part ? partOf(b) : null;
  const col = d.part ? (P ? partColor(P) : "#e5544b") : (CATCOL[d.cat] || "#d9a441");
  let inner = "";
  (d.text || []).forEach(t => {
    if (typeof t === "string") inner += `<span class="lab">${esc(t)}</span>`;
    else if (t.part) {
      const cands = state.parts.filter(x => d.part.includes(x.type));
      inner += cands.length
        ? `<select data-bpart="${b.uid}">${opts(cands.map(x => [x.name, x.uid]), b.p._part)}</select>`
        : `<span class="lab" style="color:var(--alert)">部品がありません</span>`;
    } else {
      const pm = (d.params || []).find(x => x.k === t.p);
      if (pm) inner += renderParam(b, pm);
    }
  });

  let h = `<div class="blk" data-blk="${b.uid}" data-root="${root}" style="--c:${col}" draggable="true">
    <div class="row"><span class="grip" title="ドラッグで移動">⠿</span><span class="ic">${d.icon}</span>
    ${inner}
    <span class="tools">
      <button class="iconbtn" data-bmove="${b.uid}|-1" title="上へ">▲</button>
      <button class="iconbtn" data-bmove="${b.uid}|1" title="下へ">▼</button>
      <button class="iconbtn" data-bin="${b.uid}" title="ひとつ上のブロックの中に入れる">→</button>
      <button class="iconbtn" data-bout="${b.uid}" title="外に出す">←</button>
      <button class="iconbtn del" data-bdel="${b.uid}" title="削除">✕</button>
    </span></div>`;

  (d.slots || []).forEach(s => {
    const kids = b.c[s.k] || [];
    h += `<div class="slot">`;
    if (s.label) h += `<div class="slotlab">${esc(s.label)}</div>`;
    h += dz(root, b.uid, s.k, 0);
    kids.forEach((k, i) => { h += renderBlock(k, root, b.uid, s.k) + dz(root, b.uid, s.k, i + 1); });
    if (!kids.length) h += `<div class="emptyslot" style="padding:7px">ここにブロックを入れる</div>`;
    h += `</div>`;
  });
  return h + `</div>`;
}

function renderProgram(){
  [["setup", "#progSetup", "電源を入れた直後にやることを追加できます（なくてもOK）"],
   ["loop", "#progLoop", "ここに置いたブロックが、電源を切るまでずっと動き続けます"]]
  .forEach(([root, sel, empty]) => {
    const list = state[root];
    let h = dz(root, "", "", 0);
    list.forEach((b, i) => { h += renderBlock(b, root, "", "") + dz(root, "", "", i + 1); });
    if (!list.length) h += `<div class="emptyslot">${empty}</div>`;
    $(sel).innerHTML = h;
  });
}

/* ============================================================================
   作成・編集のしくみ
   ============================================================================ */
function uniqueName(base){
  const taken = state.parts.map(p => p.name).concat(state.vars.map(v => v.name));
  /* safeName がそのまま返す＝使える名前 */
  for (let i = 1; i < 500; i++) {
    const n = base + i;
    if (safeName(n, taken) === n) return n;
  }
  return safeName(base, taken);
}
function mkPart(type, pins, optsOv, name){
  const d = PARTS[type]; if (!d) return null;
  const P = { uid:uid(), type, name: name || uniqueName(d.base), pins:{}, opts:{} };
  (d.pins || []).forEach(pd => { P.pins[pd.k] = pd.sel.def; });
  (d.opts || []).forEach(od => { P.opts[od.k] = od.def; });
  if (pins) Object.assign(P.pins, pins);
  if (optsOv) Object.assign(P.opts, optsOv);
  return P;
}
function defaultParam(pm){
  switch (pm.type) {
    case "num": case "int": return { v: pm.def, s: "" };
    case "cond": return { src:"", op:">", val:{ v:0, s:"" } };
    case "var": return state.vars.length ? state.vars[0].uid : "";
    case "valsrc": return "";
    default: return pm.def != null ? pm.def : "";
  }
}
function mkBlk(type, partUid, preset){
  const d = BLOCKS[type]; if (!d) return null;
  const b = { uid:uid(), type, p:{}, c:{} };
  (d.params || []).forEach(pm => { b.p[pm.k] = defaultParam(pm); });
  (d.slots || []).forEach(s => { b.c[s.k] = []; });
  if (d.part) {
    const cand = state.parts.find(x => x.uid === partUid) ||
                 state.parts.find(x => d.part.includes(x.type));
    b.p._part = cand ? cand.uid : null;
  }
  if (preset) Object.entries(preset).forEach(([k, v]) => {
    const pm = (d.params || []).find(x => x.k === k);
    if (pm && (pm.type === "num" || pm.type === "int"))
      b.p[k] = (v && typeof v === "object") ? v : { v, s:"" };
    else b.p[k] = v;
  });
  return b;
}

/* ------------------------------------------------------------ ツリー操作 */
function ctxOf(u, list, parent, slot, root){
  for (let i = 0; i < list.length; i++) {
    const b = list[i];
    if (b.uid === u) return { list, i, parent, slot, root, b };
    const d = BLOCKS[b.type];
    for (const s of (d && d.slots) || []) {
      const r = ctxOf(u, b.c[s.k] || [], b, s.k, root);
      if (r) return r;
    }
  }
  return null;
}
function findBlk(u){
  return ctxOf(u, state.setup, null, "", "setup") || ctxOf(u, state.loop, null, "", "loop");
}
function listAt(root, parentUid, slot){
  if (!parentUid) return state[root];
  const c = findBlk(parentUid);
  if (!c) return state[root];
  c.b.c[slot] = c.b.c[slot] || [];
  return c.b.c[slot];
}
function isInside(ancestorUid, uid2){
  const c = findBlk(ancestorUid); if (!c) return false;
  const walk = (list) => list.some(b =>
    b.uid === uid2 || Object.values(b.c || {}).some(l => walk(l || [])));
  return Object.values(c.b.c || {}).some(l => walk(l || []));
}
function pluck(u){
  const c = findBlk(u); if (!c) return null;
  return c.list.splice(c.i, 1)[0];
}

/* ------------------------------------------------------------ 挿入位置 */
let selUid = null;
function addBlock(type, partUid){
  const b = mkBlk(type, partUid); if (!b) return;
  const sel = selUid ? findBlk(selUid) : null;
  if (sel) {
    const sd = BLOCKS[sel.b.type];
    if (sd && sd.slots) { sel.b.c[sd.slots[0].k].push(b); }
    else sel.list.splice(sel.i + 1, 0, b);
  } else {
    state.loop.push(b);
  }
  selUid = b.uid;
  refresh();
  setTimeout(() => {
    const el = document.querySelector(`[data-blk="${b.uid}"]`);
    if (el) el.scrollIntoView({ block:"nearest", behavior:"smooth" });
  }, 0);
}
function addPart(type){
  const d = PARTS[type]; if (!d) return;
  const P = mkPart(type);
  const used = new Set(Object.keys(pinUsage()));

  /* I2C部品を最初に入れるとき、SDA/SCL が空いていなければペアごと引っ越す */
  if (d.bus === "i2c" && !usesI2C() && (used.has(state.i2c.sda) || used.has(state.i2c.scl))) {
    for (let n = 0; n <= 20; n += 2) {
      const sda = "GP" + n, scl = "GP" + (n + 1);
      if (!used.has(sda) && !used.has(scl)) { state.i2c.sda = sda; state.i2c.scl = scl; break; }
    }
  }
  if (d.bus === "i2c") { used.add(state.i2c.sda); used.add(state.i2c.scl); }

  /* 空いているピンを順にわりあてる */
  (d.pins || []).forEach(pd => {
    const list = pd.sel.kind === "adc" ? GP_ADC : GP_ALL;
    let pin = P.pins[pd.k];
    if (used.has(pin)) pin = list.find(x => !used.has(x)) || pin;
    P.pins[pd.k] = pin;
    used.add(pin);
  });

  state.parts.push(P);
  palTab = "blocks";
  document.querySelectorAll("#palTabs button").forEach(x => x.classList.toggle("on", x.dataset.pal === "blocks"));
  refresh();
  toast(`${d.name} を追加しました。動作ブロックが左に出ています`);
}

/* ============================================================================
   イベント
   ============================================================================ */
function toast(msg, ms){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove("on"), ms || 2200);
}
/* 右カラムのタブを開く。スマホでは右カラム自体も出す */
function showTab(name){
  const btn = document.querySelector(`#rTabs button[data-pane="${name}"]`);
  if (!btn) return;
  document.querySelectorAll("#rTabs button").forEach(x => x.classList.toggle("on", x === btn));
  document.querySelectorAll(".rpane").forEach(p => p.classList.toggle("on", p.id === "pane-" + name));
  const nav = document.querySelector('#mobNav button[data-col="right"]');
  if (nav && getComputedStyle(document.getElementById("mobNav")).display !== "none") nav.click();
}
function pathParam(str){ const [u, k] = str.split("|"); return { b: findBlk(u), k }; }

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-addpart],[data-addblk],[data-pdel],[data-pmove],[data-vdel]," +
    "[data-bdel],[data-bmove],[data-bin],[data-bout],[data-blk],[data-pal],[data-pane],[data-col]");
  if (!t) return;

  if (t.dataset.addpart) { addPart(t.dataset.addpart); return; }
  if (t.dataset.addblk) { addBlock(t.dataset.addblk, t.dataset.part); return; }

  if (t.dataset.pdel) {
    const P = partByUid(t.dataset.pdel);
    if (P && confirm(`${P.name} を削除します。この部品を使うブロックも消えます。よろしいですか？`)) {
      const purge = (list) => list.filter(b => {
        if (b.p && b.p._part === P.uid) return false;
        Object.keys(b.c || {}).forEach(k => { b.c[k] = purge(b.c[k] || []); });
        return true;
      });
      state.setup = purge(state.setup); state.loop = purge(state.loop);
      state.parts = state.parts.filter(x => x.uid !== P.uid);
      refresh();
    }
    return;
  }
  if (t.dataset.pmove) {
    const [u, d] = t.dataset.pmove.split("|");
    const i = state.parts.findIndex(x => x.uid === u), j = i + Number(d);
    if (i >= 0 && j >= 0 && j < state.parts.length) {
      const [x] = state.parts.splice(i, 1); state.parts.splice(j, 0, x); refresh();
    }
    return;
  }
  if (t.dataset.vdel) {
    state.vars = state.vars.filter(v => v.uid !== t.dataset.vdel); refresh(); return;
  }
  if (t.dataset.bdel) {
    pluck(t.dataset.bdel); if (selUid === t.dataset.bdel) selUid = null; refresh(); return;
  }
  if (t.dataset.bmove) {
    const [u, d] = t.dataset.bmove.split("|");
    const c = findBlk(u); if (!c) return;
    const j = c.i + Number(d);
    if (j >= 0 && j < c.list.length) {
      const [x] = c.list.splice(c.i, 1); c.list.splice(j, 0, x); refresh();
    }
    return;
  }
  if (t.dataset.bin) {
    const c = findBlk(t.dataset.bin); if (!c || c.i === 0) { toast("すぐ上に「くり返す」や「もし〜なら」があると、中に入れられます"); return; }
    const prev = c.list[c.i - 1], pd = BLOCKS[prev.type];
    if (!pd || !pd.slots) { toast("すぐ上のブロックは、中にブロックを入れられません"); return; }
    const x = c.list.splice(c.i, 1)[0];
    prev.c[pd.slots[0].k].push(x); refresh(); return;
  }
  if (t.dataset.bout) {
    const c = findBlk(t.dataset.bout); if (!c || !c.parent) { toast("これ以上は外に出せません"); return; }
    const pc = findBlk(c.parent.uid);
    const x = c.list.splice(c.i, 1)[0];
    pc.list.splice(pc.i + 1, 0, x); refresh(); return;
  }
  if (t.dataset.pal) {
    palTab = t.dataset.pal;
    document.querySelectorAll("#palTabs button").forEach(x => x.classList.toggle("on", x === t));
    renderPalette(); return;
  }
  if (t.dataset.pane) {
    document.querySelectorAll("#rTabs button").forEach(x => x.classList.toggle("on", x === t));
    document.querySelectorAll(".rpane").forEach(p => p.classList.toggle("on", p.id === "pane-" + t.dataset.pane));
    return;
  }
  if (t.dataset.col) {
    document.querySelectorAll("#mobNav button").forEach(x => x.classList.toggle("on", x === t));
    ["left","mid","right"].forEach(c =>
      document.getElementById("col" + c[0].toUpperCase() + c.slice(1)).classList.toggle("show", c === t.dataset.col));
    return;
  }
  if (t.dataset.blk) {
    if (e.target.closest("input,select,textarea")) return;
    selUid = (selUid === t.dataset.blk) ? null : t.dataset.blk;
    document.querySelectorAll(".blk").forEach(x => x.classList.toggle("sel", x.dataset.blk === selUid));
  }
});

/* --- 値の変更 --- */
function onEdit(e, isChange){
  const el = e.target, ds = el.dataset;
  let full = false, hit = true;

  if (ds.pname) {
    const P = partByUid(ds.pname);
    if (P) {
      P.name = el.value.trim();
      /* 入力を確定した時点で、Pythonの名前として使える形に直す */
      if (isChange) {
        const taken = state.parts.filter(x => x !== P).map(x => x.name).concat(state.vars.map(v => v.name));
        const s = safeName(P.name, taken);
        if (s !== P.name) { P.name = s; toast(`名前を「${s}」に直しました`); }
      }
    }
    full = isChange;
  }
  else if (ds.ppin) { const [u, k] = ds.ppin.split("|"); const P = partByUid(u); if (P) P.pins[k] = el.value; full = true; }
  else if (ds.popt) {
    const [u, k] = ds.popt.split("|"); const P = partByUid(u);
    if (P) P.opts[k] = (el.type === "checkbox") ? el.checked
      : (el.type === "number" ? Number(el.value) : el.value);
    full = true;
  }
  else if (ds.i2c) { state.i2c[ds.i2c] = el.value; full = true; }
  else if (ds.vname) {
    const v = varByUid(ds.vname);
    if (v) {
      v.name = el.value.trim();
      if (isChange) {
        const taken = state.parts.map(x => x.name).concat(state.vars.filter(x => x !== v).map(x => x.name));
        const s = safeName(v.name, taken);
        if (s !== v.name) { v.name = s; toast(`名前を「${s}」に直しました`); }
      }
    }
    full = isChange;
  }
  else if (ds.vinit) { const v = varByUid(ds.vinit); if (v) v.init = el.value; }
  else if (ds.vkind) { const v = varByUid(ds.vkind); if (v) v.kind = el.value; full = true; }
  else if (ds.bnum) { const { b, k } = pathParam(ds.bnum); if (b) b.b.p[k].v = Number(el.value); }
  else if (ds.bsrc) { const { b, k } = pathParam(ds.bsrc); if (b) { b.b.p[k].s = el.value; full = true; } }
  else if (ds.btext) { const { b, k } = pathParam(ds.btext); if (b) b.b.p[k] = el.value; }
  else if (ds.bsel) { const { b, k } = pathParam(ds.bsel); if (b) b.b.p[k] = el.value; }
  else if (ds.bcol) { const { b, k } = pathParam(ds.bcol); if (b) b.b.p[k] = el.value; }
  else if (ds.bvar) { const { b, k } = pathParam(ds.bvar); if (b) b.b.p[k] = el.value; }
  else if (ds.bvs) { const { b, k } = pathParam(ds.bvs); if (b) b.b.p[k] = el.value; }
  else if (ds.bpart) { const c = findBlk(ds.bpart); if (c) { c.b.p._part = el.value; full = true; } }
  else if (ds.bcsrc) { const { b, k } = pathParam(ds.bcsrc); if (b) {
      const c = b.b.p[k]; c.src = el.value;
      c.op = condKind(c.src) === "bool" ? "" : ">";
      full = true; } }
  else if (ds.bcop) { const { b, k } = pathParam(ds.bcop); if (b) b.b.p[k].op = el.value; }
  else if (ds.bcval) { const { b, k } = pathParam(ds.bcval); if (b) b.b.p[k].val.v = Number(el.value); }
  else if (ds.bcvsrc) { const { b, k } = pathParam(ds.bcvsrc); if (b) { b.b.p[k].val.s = el.value; full = true; } }
  else if (el.id === "projName") { state.name = el.value; }
  else hit = false;

  if (hit) refresh(full);
}
document.addEventListener("input", (e) => onEdit(e, false));
document.addEventListener("change", (e) => onEdit(e, true));

/* --- ドラッグ＆ドロップ --- */
let dragUid = null, dragNew = null;
document.addEventListener("dragstart", (e) => {
  const pal = e.target.closest("[data-addblk]");
  if (pal) { dragNew = { type: pal.dataset.addblk, part: pal.dataset.part }; dragUid = null;
             e.dataTransfer.effectAllowed = "copy"; try { e.dataTransfer.setData("text/plain", "new"); } catch (x) {} return; }
  const blk = e.target.closest(".blk");
  if (blk) { dragUid = blk.dataset.blk; dragNew = null; blk.classList.add("dragging");
             e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", dragUid); } catch (x) {} }
});
document.addEventListener("dragend", () => {
  dragUid = null; dragNew = null;
  document.querySelectorAll(".dragging").forEach(x => x.classList.remove("dragging"));
  document.querySelectorAll(".dz.over").forEach(x => x.classList.remove("over"));
});
document.addEventListener("dragover", (e) => {
  const z = e.target.closest(".dz"); if (!z || (!dragUid && !dragNew)) return;
  e.preventDefault();
  document.querySelectorAll(".dz.over").forEach(x => x.classList.remove("over"));
  z.classList.add("over");
});
document.addEventListener("drop", (e) => {
  const z = e.target.closest(".dz"); if (!z) return;
  e.preventDefault();
  const [root, parentUid, slot, idxs] = z.dataset.dz.split("|");
  let index = Number(idxs);
  if (dragNew) {
    const b = mkBlk(dragNew.type, dragNew.part);
    if (b) { listAt(root, parentUid, slot).splice(index, 0, b); selUid = b.uid; }
  } else if (dragUid) {
    if (parentUid && (parentUid === dragUid || isInside(dragUid, parentUid))) { toast("自分の中には入れられません"); return; }
    const c = findBlk(dragUid);
    const same = c && c.list === listAt(root, parentUid, slot);
    if (same && c.i < index) index--;
    const b = pluck(dragUid);
    if (b) listAt(root, parentUid, slot).splice(index, 0, b);
  }
  dragUid = null; dragNew = null;
  refresh();
});

function resetProject(name){
  state.name = name; state.parts = []; state.vars = []; state.setup = []; state.loop = [];
  state.i2c = { sda:"GP0", scl:"GP1" };
  selUid = null;
  $("#projName").value = name;
}

function download(filename, text){
  const blob = new Blob([text], { type:"text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
/* そのままでは動かないコードを持ち出させない */
function blockIfBroken(g){
  if (!g.errs.length) return false;
  showTab("wire");
  toast("このままでは動きません：" + g.errs[0], 4200);
  return true;
}
function doDownload(){
  const g = generate();
  if (blockIfBroken(g)) return;
  download("code.py", g.code);
  toast(g.warns.length ? "code.py を書き出しました（配線タブに注意点があります）" : "code.py を書き出しました");
}
$("#btnDownload").addEventListener("click", doDownload);
$("#btnDl2").addEventListener("click", doDownload);

$("#btnCopy").addEventListener("click", async () => {
  const g = generate();
  if (blockIfBroken(g)) return;
  const txt = g.code;
  try { await navigator.clipboard.writeText(txt); toast("コピーしました"); }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("コピーしました"); }
    catch (x) { toast("コピーできませんでした。手で選択してください"); }
    ta.remove();
  }
});

$("#btnSave").addEventListener("click", () => {
  const data = { app:"PICO CIRCUITPYTHON BLOCK BUILDER", version:1, name:state.name, i2c:state.i2c,
                 parts:state.parts, vars:state.vars, setup:state.setup, loop:state.loop };
  const safe = (state.name || "project").replace(/[\\/:*?"<>|]/g, "_");
  download(safe + ".picoblocks.json", JSON.stringify(data, null, 1));
  toast("プロジェクトを保存しました");
});
$("#btnLoad").addEventListener("click", () => $("#fileInput").click());
$("#fileInput").addEventListener("change", (e) => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.parts)) throw new Error("形式がちがいます");
      state.name = d.name || "読み込んだプロジェクト";
      state.i2c = d.i2c || { sda:"GP0", scl:"GP1" };
      state.parts = d.parts; state.vars = d.vars || [];
      state.setup = d.setup || []; state.loop = d.loop || [];
      selUid = null;
      $("#projName").value = state.name;
      /* 古いファイルや手で書き換えたファイルに使えない名前が入っていても直す */
      const fixed = fixAllNames();
      refresh();
      toast(fixed ? "読み込みました（使えない名前を直しました）" : "読み込みました");
    } catch (err) {
      toast("読み込めませんでした：" + err.message);
    }
    e.target.value = "";
  };
  r.readAsText(f);
});

$("#btnAddVar").addEventListener("click", () => {
  state.vars.push({ uid:uid(), name:uniqueName("value"), init:"0", kind:"num" });
  refresh(); toast("変数を追加しました");
});
$("#btnClearProg").addEventListener("click", () => {
  if (confirm("部品もブロックも、すべて消します。よろしいですか？")) {
    resetProject("あたらしいプロジェクト"); refresh();
  }
});
$("#palSearch").addEventListener("input", (e) => { palQ = e.target.value; renderPalette(); });

window.addEventListener("beforeunload", (e) => {
  if (dirty) { e.preventDefault(); e.returnValue = ""; }
});

TEMPLATES[0].build();
refresh();
dirty = false;
